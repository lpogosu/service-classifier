[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-classifier"
version = "1.0.0"
description = "Гибридный пайплайн выделения самостоятельных услуг из текста объявления о ремонте"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lpogosu" }]
keywords = ["nlp", "russian", "text-classification", "pymorphy3", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
]
dependencies = [
    "pymorphy3>=2.0",
    "rapidfuzz>=3.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "aiohttp>=3.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
service-classifier = "service_classifier.cli:main"

[tool.setuptools]
packages = ["service_classifier", "api", "data", "training", "training.experiments"]

[tool.setuptools.package-data]
api = ["static/*.html"]
data = ["*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    # Русские строки в коде — часть предметной области, а не опечатка.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Модели Pydantic и FastAPI повторяют camelCase контракта API.
"api/server.py" = ["N815", "N803"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
files = ["service_classifier", "api", "data", "training", "tests"]

# У pymorphy3, rapidfuzz и scipy нет разметки типов в дистрибутиве.
[[tool.mypy.overrides]]
module = ["pymorphy3.*", "rapidfuzz.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

# sklearn возвращает Any почти отовсюду (predict_proba, cross_val_predict,
# fit_transform), поэтому в модулях, работающих с моделями, строгие запреты на
# Any пришлось бы обходить приведениями в каждой второй строке. Остальная
# строгость (аннотации, Optional, unreachable) здесь сохраняется.
[[tool.mypy.overrides]]
module = [
    "service_classifier.split",
    "training.train_split_classifier",
    "training.experiments.tfidf_detection_baseline",
    "training.experiments.hybrid_gbm_llm",
]
disallow_any_explicit = false
disallow_any_expr = false
warn_return_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
