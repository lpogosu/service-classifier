name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Typecheck
        run: python -m mypy

      - name: Tests
        run: python -m pytest -q

      - name: Smoke run without network
        env:
          OPENROUTER_API_KEY: ""
        run: |
          python -m data.synthetic --rows 200
          python -m training.train_split_classifier
          python -m service_classifier --dataset data/synthetic_dataset.csv \
            --evaluate --no-drafts --max-items 100

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          push: false
          load: true
          tags: service-classifier:ci
